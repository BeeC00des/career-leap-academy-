# Render Blueprint — New > Blueprint, point it at this repo.
services:
  - type: web
    name: careerleap-api
    runtime: node
    rootDir: server
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "2"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false   # paste your Atlas connection string in the dashboard
      - key: CLIENT_URL
        sync: false   # your Vercel URL, e.g. https://careerleap.vercel.app (used in reset-password emails)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
